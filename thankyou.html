<body>
  <div class="thankyou-header">
    <img src="images/logo.png" alt="Luxe Beauty Trip" class="thankyou-logo">
    <div class="thankyou-icon">✦</div>
    <h1>We'll be in touch soon.</h1>
    <p>Thank you for reaching out. In the meantime, book a free 20-minute discovery call and let us start planning your Seoul experience.</p>
  </div>

  <div class="calendly-section">
    <p class="calendly-label">Book your free discovery call</p>
    <div id="calendly-embed"></div>
  </div>

  <div class="thankyou-links">
    <a href="index.html" class="btn btn-rose">Back to Home</a>
    <a href="blog.html" class="btn" style="background:#f5efeb; color:var(--navy);">Read the Blog</a>
  </div>

  <script src="https://assets.calendly.com/assets/external/widget.js" async></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const name = params.get('name') || '';
      const email = params.get('email') || '';
      let url = 'https://calendly.com/luxebeautytrip/20min?hide_gdpr_banner=1';
      if (name) url += '&name=' + encodeURIComponent(name);
      if (email) url += '&email=' + encodeURIComponent(email);

      window.addEventListener('load', function () {
        if (window.Calendly) {
          Calendly.initInlineWidget({
            url: url,
            parentElement: document.getElementById('calendly-embed'),
            prefill: { name: name, email: email },
          });
        } else {
          // Fallback: plain iframe if widget script hasn't loaded
          const el = document.getElementById('calendly-embed');
          el.innerHTML = '<iframe src="' + url + '" width="100%" height="700" frameborder="0"></iframe>';
        }
      });
    })();
  </script>
</body>
