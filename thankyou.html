  <div class="ty-logo-wrap">
    <img src="images/logo.png" alt="Luxe Beauty Trip" class="ty-logo">

  <div class="calendly-section">
    <p class="calendly-label">Book your free 20-minute discovery call</p>

  <div class="ty-text">

  </div>

  <script src="https://assets.calendly.com/assets/external/widget.js" async></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const name = params.get('name') || '';
      const email = params.get('email') || '';
      let url = 'https://calendly.com/luxebeautytrip/20min?hide_gdpr_banner=1&timezone=America%2FLos_Angeles';
      if (name) url += '&name=' + encodeURIComponent(name);
      if (email) url += '&email=' + encodeURIComponent(email);

      function initCalendly() {
        if (window.Calendly) {
          Calendly.initInlineWidget({
            url: url,
            parentElement: document.getElementById('calendly-embed'),
            prefill: { name: name, email: email },
          });
        } else {
          document.getElementById('calendly-embed').innerHTML =
            '<iframe src="' + url + '" width="100%" height="700" frameborder="0"></iframe>';
        }
      }

      if (document.readyState === 'complete') {
        initCalendly();
      } else {
        window.addEventListener('load', initCalendly);
      }
    })();
  </script>
